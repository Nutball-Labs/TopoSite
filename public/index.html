<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TopoSite</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
    :root {
        --bg: #f4f4f2;
        --panel: #ffffff;
        --text: #222222;
        --muted: #666666;
        --border: #cccccc;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #1e1f22;
            --panel: #2b2d31;
            --text: #e6e6e6;
            --muted: #9a9a9a;
            --border: #44464b;
        }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font: 14px/1.4 system-ui, sans-serif; }
    #map { position: absolute; inset: 0; background: var(--bg); }

    .ts-panel { background: var(--panel); color: var(--text); border: 1px solid var(--border);
        border-radius: 6px; padding: 8px 10px; box-shadow: 0 1px 4px rgb(0 0 0 / 20%); }
    .ts-panel h1 { font-size: 15px; margin: 0 0 4px; }
    .ts-panel .muted { color: var(--muted); font-size: 12px; }
    .ts-panel button { font: inherit; padding: 4px 10px; cursor: pointer; }
    .ts-panel button:disabled { cursor: default; opacity: 0.6; }
    #ts-status { max-width: 260px; margin-top: 4px; }
    #ts-status a { color: inherit; }

    .ts-legend { font-size: 12px; }
    .ts-legend div { display: flex; align-items: center; gap: 6px; }
    .ts-legend .sw { width: 12px; height: 12px; border-radius: 2px; flex: none; }
    .ts-legend .ln { width: 18px; height: 0; border-top: 3px solid; flex: none; }
    .ts-legend h2 { font-size: 12px; margin: 6px 0 2px; }

    .ts-node { overflow: visible; }
    .ts-node svg { overflow: visible; }
    .ts-node .lbl { position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
        white-space: nowrap; font-size: 11px; color: var(--text); text-shadow: 0 0 3px var(--bg);
        display: none; pointer-events: none; }
    .ts-labels .ts-node .lbl { display: block; }

    .leaflet-control-layers, .leaflet-tooltip { background: var(--panel); color: var(--text);
        border-color: var(--border); }
</style>
</head>
<body>
<div id="map"></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/socket.io/socket.io.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
