<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TopoSite</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
    /* Light by default. Dark when Z-Wave JS UI's theme is dark (data-theme set by the
       script below), or when it's "system" and the OS prefers dark. */
    :root {
        --bg: #f4f4f2;
        --panel: #ffffff;
        --hover: #eeeeee;
        --text: #222222;
        --muted: #666666;
        --border: #cccccc;
        color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --bg: #121212;
            --panel: #1e1e1e;
            --hover: #2c2c2c;
            --text: #e0e0e0;
            --muted: #9e9e9e;
            --border: #3c3c3c;
            color-scheme: dark;
        }
    }
    :root[data-theme="dark"] {
        --bg: #121212;
        --panel: #1e1e1e;
        --hover: #2c2c2c;
        --text: #e0e0e0;
        --muted: #9e9e9e;
        --border: #3c3c3c;
        color-scheme: dark;
    }
    /* hidden always hides, whatever display a class rule sets */
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font: 14px/1.4 system-ui, sans-serif; }
    /* Map on the left, resizable controls pane on the right */
    #ts-app { position: absolute; inset: 0; display: flex; }
    #map { flex: 1 1 auto; min-width: 0; height: 100%; background: var(--bg); }
    #ts-resizer { flex: none; width: 6px; cursor: col-resize; background: var(--border); touch-action: none; }
    #ts-resizer:hover, #ts-resizer:focus-visible, #ts-resizer.drag { background: var(--muted); outline: none; }
    /* Sized in em throughout: setupPane() sets font-size from the pane's width */
    #ts-pane { flex: none; width: 300px; height: 100%; overflow-y: auto; background: var(--panel);
        color: var(--text); font-size: 14px; }
    #ts-pane .ts-panel { border: none; border-radius: 0; box-shadow: none; padding: 0.8em 1em;
        border-bottom: 1px solid var(--border); }

    .ts-panel { background: var(--panel); color: var(--text); border: 1px solid var(--border);
        border-radius: 6px; padding: 8px 10px; box-shadow: 0 1px 4px rgb(0 0 0 / 20%); }
    .ts-panel h1 { font-size: 1.1em; margin: 0 0 0.3em; }
    .ts-panel .muted { color: var(--muted); font-size: 0.86em; }
    .ts-panel button { font: inherit; padding: 0.3em 0.7em; cursor: pointer; }
    .ts-panel button:disabled { cursor: default; opacity: 0.6; }
    #ts-status { margin-top: 0.4em; }
    .ts-row { display: flex; flex-wrap: wrap; gap: 0.45em; align-items: center; margin-top: 0.45em; }
    .ts-row select { font: inherit; flex: 1 1 8em; min-width: 0; }
    .ts-unplaced { opacity: 0.45; }
    .ts-menu { font-size: 13px; min-width: 160px; }
    .ts-menu-title { font-weight: 600; margin-bottom: 6px; }
    .ts-menu-actions { display: flex; flex-direction: column; gap: 4px; }
    .ts-menu-actions button { font: inherit; padding: 4px 10px; text-align: left; cursor: pointer; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--text); }
    #ts-status a { color: inherit; }

    .ts-legend { font-size: 0.9em; }
    .ts-legend #ts-legend-body > div { display: flex; align-items: center; gap: 0.5em; }
    .ts-legend .sw { width: 1em; height: 1em; border-radius: 0.15em; flex: none; }
    .ts-legend .ln { width: 1.5em; height: 0; border-top: 0.25em solid; flex: none; }
    .ts-legend h2 { font-size: 1em; margin: 0.5em 0 0.15em; }
    /* Full-width button with centred text; toggles the legend (user, 2026-10-10) */
    .ts-legend-toggle { display: block; width: 100%; text-align: center; font: 600 1.1em/1.2 system-ui, sans-serif;
        color: var(--text); background: var(--hover); border: 1px solid var(--border); border-radius: 0.35em;
        padding: 0.5em; cursor: pointer; }
    .ts-legend-toggle:hover { border-color: var(--muted); }
    .ts-legend-toggle[aria-expanded="true"] { background: var(--panel); }
    #ts-legend-body { margin-top: 0.5em; }

    .ts-node { overflow: visible; }
    .ts-node svg { overflow: visible; }
    .ts-node .lbl { position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
        white-space: nowrap; font-size: 11px; color: var(--text); text-shadow: 0 0 3px var(--bg);
        display: none; pointer-events: none; }
    .ts-labels .ts-node .lbl { display: block; }

    .leaflet-control-layers, .leaflet-tooltip { background: var(--panel); color: var(--text);
        border-color: var(--border); }
    .ts-layers-btn { font: 600 13px/1.2 system-ui, sans-serif; padding: 7px 12px; cursor: pointer;
        background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
        box-shadow: 0 1px 4px rgb(0 0 0 / 25%); }
    .ts-layers-btn:hover, .ts-layers-btn[aria-expanded="true"] { background: var(--hover); }
    .ts-layers-pop { margin-top: 6px; padding: 8px 12px; background: var(--panel); color: var(--text);
        border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 2px 8px rgb(0 0 0 / 30%); }
    .ts-layers-pop label { display: block; white-space: nowrap; padding: 3px 0; cursor: pointer; }
    .leaflet-bar { border-color: var(--border); }
    .leaflet-bar a, .leaflet-bar a:hover { background: var(--panel); color: var(--text); border-bottom-color: var(--border); }
    .leaflet-bar a:hover { background: var(--hover); }
    .leaflet-tooltip-top:before { border-top-color: var(--panel); }
    .leaflet-tooltip-bottom:before { border-bottom-color: var(--panel); }
    .leaflet-tooltip-left:before { border-left-color: var(--panel); }
    .leaflet-tooltip-right:before { border-right-color: var(--panel); }
    .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
    .leaflet-control-layers-separator { border-top-color: var(--border); }

</style>
<script>
    // Follow Z-Wave JS UI's theme. It stores 'dark' | 'light' | 'system' in localStorage
    // 'colorScheme' (older installs: 'dark' = 'true' | 'false') on this same origin.
    // 'system' leaves data-theme unset so the prefers-color-scheme rule applies.
    (function () {
        function zuiTheme() {
            try {
                var s = localStorage.getItem('colorScheme')
                if (s === 'dark' || s === 'light') return s
                if (s === 'system') return null
                var d = localStorage.getItem('dark')
                return d === 'true' ? 'dark' : d === 'false' ? 'light' : null
            } catch (e) { return null }
        }
        function apply() {
            var t = zuiTheme()
            if (t) document.documentElement.setAttribute('data-theme', t)
            else document.documentElement.removeAttribute('data-theme')
        }
        apply()
        // A theme change in a Z-Wave JS UI tab, or in the OS, restyles TopoSite live
        window.addEventListener('storage', function (e) {
            if (e.key === null || e.key === 'colorScheme' || e.key === 'dark') { apply(); window.dispatchEvent(new Event('ts-theme')) }
        })
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
            window.dispatchEvent(new Event('ts-theme'))
        })
    })()
</script>
</head>
<body>
<div id="ts-app">
    <div id="map"></div>
    <div id="ts-resizer" role="separator" aria-orientation="vertical" aria-label="Resize the side pane" tabindex="0"
         title="Drag to resize (or focus and use ← →)"></div>
    <aside id="ts-pane" aria-label="TopoSite controls and legend"></aside>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/socket.io/socket.io.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
