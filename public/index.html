<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TopoSite</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
    /* Light by default. Dark when Z-Wave JS UI's theme is dark (data-theme set by the
       script below), or when it's "system" and the OS prefers dark. */
    :root {
        --bg: #f4f4f2;
        --panel: #ffffff;
        --hover: #eeeeee;
        --text: #222222;
        --muted: #666666;
        --border: #cccccc;
        color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --bg: #121212;
            --panel: #1e1e1e;
            --hover: #2c2c2c;
            --text: #e0e0e0;
            --muted: #9e9e9e;
            --border: #3c3c3c;
            color-scheme: dark;
        }
    }
    :root[data-theme="dark"] {
        --bg: #121212;
        --panel: #1e1e1e;
        --hover: #2c2c2c;
        --text: #e0e0e0;
        --muted: #9e9e9e;
        --border: #3c3c3c;
        color-scheme: dark;
    }
    /* hidden always hides, whatever display a class rule sets */
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font: 14px/1.4 system-ui, sans-serif; }
    /* Map on the left, resizable controls pane on the right */
    #ts-app { position: absolute; inset: 0; display: flex; }
    #map { flex: 1 1 auto; min-width: 0; height: 100%; background: var(--bg); }
    #ts-resizer { flex: none; width: 6px; cursor: col-resize; background: var(--border); touch-action: none; }
    #ts-resizer:hover, #ts-resizer:focus-visible, #ts-resizer.drag { background: var(--muted); outline: none; }
    /* Sized in em throughout: setupPane() sets font-size from the pane's width */
    #ts-pane { flex: none; width: 300px; height: 100%; overflow-y: auto; background: var(--panel);
        color: var(--text); font-size: 14px; }
    #ts-pane .ts-panel { border: none; border-radius: 0; box-shadow: none; padding: 0.8em 1em;
        border-bottom: 1px solid var(--border); }

    .ts-panel { background: var(--panel); color: var(--text); border: 1px solid var(--border);
        border-radius: 6px; padding: 8px 10px; box-shadow: 0 1px 4px rgb(0 0 0 / 20%); }
    .ts-panel h1 { font-size: 1.1em; margin: 0 0 0.3em; }
    .ts-panel .muted { color: var(--muted); font-size: 0.86em; }
    .ts-panel button { font: inherit; padding: 0.3em 0.7em; cursor: pointer; }
    .ts-panel button:disabled { cursor: default; opacity: 0.6; }
    #ts-status { margin-top: 0.4em; }
    .ts-row { display: flex; flex-wrap: wrap; gap: 0.45em; align-items: center; margin-top: 0.45em; }
    .ts-row select { font: inherit; flex: 1 1 8em; min-width: 0; }
    .ts-menu { font-size: 13px; min-width: 160px; }
    .ts-menu-title { font-weight: 600; margin-bottom: 6px; }
    .ts-menu-actions { display: flex; flex-direction: column; gap: 4px; }
    .ts-menu-actions button { font: inherit; padding: 4px 10px; text-align: left; cursor: pointer; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--text); }
    #ts-status a { color: inherit; }

    .ts-legend { font-size: 0.9em; }
    .ts-legend #ts-legend-body > div { display: flex; align-items: center; gap: 0.5em; }
    .ts-legend .sw { width: 1em; height: 1em; border-radius: 0.15em; flex: none; }
    .ts-legend .ln { width: 1.5em; height: 0; border-top: 0.25em solid; flex: none; }
    .ts-legend h2 { font-size: 1em; margin: 0.5em 0 0.15em; }
    /* Full-width buttons with centred text: Map, Background, Refresh neighbors, Legend (user, 2026-10-10) */
    .ts-wide, .ts-legend-toggle { display: block; width: 100%; text-align: center; font: 600 1.1em/1.2 system-ui, sans-serif;
        color: var(--text); background: var(--hover); border: 1px solid var(--border); border-radius: 0.35em;
        padding: 0.5em; cursor: pointer; }
    .ts-wide:hover:not(:disabled), .ts-legend-toggle:hover { border-color: var(--muted); }
    .ts-wide[aria-expanded="true"], .ts-legend-toggle[aria-expanded="true"] { background: var(--panel); }
    .ts-wide { margin-top: 0.5em; }
    .ts-wide:disabled { cursor: default; opacity: 0.5; }
    .ts-menu-items:not([hidden]) { display: flex; flex-direction: column; gap: 0.3em; margin: 0.35em 0 0 0.8em; }
    .ts-menu-items > button { text-align: left; }
    .ts-menu-items > button:disabled { opacity: 0.5; cursor: help; }
    .ts-nameform:not([hidden]) { display: flex; gap: 0.3em; }
    .ts-nameform input { font: inherit; flex: 1 1 6em; min-width: 0; }
    .ts-field { display: flex; align-items: center; gap: 0.5em; margin-top: 0.5em; }
    .ts-field select { font: inherit; flex: 1 1 auto; min-width: 0; }
    #ts-legend-body { margin-top: 0.5em; }
    /* Edit mode (MAPS.md step 2): toggle, node list, unplaced tray */
    #ts-edit[aria-pressed="true"] { background: #2e7d32; color: #fff; border-color: #2e7d32; }
    #ts-editsec h2 { font-size: 1em; margin: 0.9em 0 0.3em; }
    .ts-rule { display: flex; flex-wrap: wrap; gap: 0.3em 1em; }
    .ts-quick { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3em; margin: 0.4em 0; }
    .ts-quick button { padding: 0.15em 0.55em; }
    .ts-quick select { font: inherit; flex: 1 1 7em; min-width: 0; }
    #ts-nfilter { font: inherit; width: 100%; box-sizing: border-box; margin-bottom: 0.3em; }
    .ts-nodelist { max-height: 40vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 0.3em; padding: 0.2em 0.4em; }
    .ts-nodelist label:not([hidden]) { display: flex; align-items: baseline; gap: 0.4em; padding: 0.1em 0; cursor: pointer; }
    .ts-shape { flex: none; width: 1em; text-align: center; text-shadow: 0 0 1px var(--text); }
    .ts-tray:not([hidden]) { display: flex; flex-wrap: wrap; gap: 0.3em; margin-top: 0.3em; }
    .ts-tray button { cursor: grab; text-align: left; }
    .ts-newmap fieldset { border: 1px solid var(--border); border-radius: 0.3em; margin: 0.7em 0 0; padding: 0.3em 0.7em 0.5em; }
    .ts-newmap fieldset label { display: block; padding: 0.15em 0; }
    .ts-newmap { max-width: 560px; }
    .ts-newmap select { font: inherit; flex: 1 1 auto; min-width: 0; }

    .ts-node { overflow: visible; }
    .ts-node svg { overflow: visible; }
    .ts-node .lbl { position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
        white-space: nowrap; font-size: 11px; color: var(--text); text-shadow: 0 0 3px var(--bg);
        display: none; pointer-events: none; }
    .ts-labels .ts-node .lbl { display: block; }

    .leaflet-control-layers, .leaflet-tooltip { background: var(--panel); color: var(--text);
        border-color: var(--border); }
    .ts-layers-btn { font: 600 13px/1.2 system-ui, sans-serif; padding: 7px 12px; cursor: pointer;
        background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
        box-shadow: 0 1px 4px rgb(0 0 0 / 25%); }
    .ts-layers-btn:hover, .ts-layers-btn[aria-expanded="true"] { background: var(--hover); }
    .ts-layers-pop { margin-top: 6px; padding: 8px 12px; background: var(--panel); color: var(--text);
        border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 2px 8px rgb(0 0 0 / 30%); }
    .ts-layers-pop label { display: block; white-space: nowrap; padding: 3px 0; cursor: pointer; }
    /* Placeholders: imported positions with no matched device */
    /* Ghosts: repeaters on a shown route that aren't drawn as nodes (MAPS.md step 3) */
    .ts-ghost circle { fill: #9e9e9e; stroke: var(--panel); stroke-width: 1.5; opacity: 0.85; }
    .ts-ghost.ts-approx circle { fill: none; stroke: #9e9e9e; stroke-width: 2; stroke-dasharray: 2 2; }
    .ts-ghost .lbl { top: 13px; font-size: 10px; color: var(--muted); }
    .ts-gsw { width: 0.8em; height: 0.8em; border-radius: 50%; background: #9e9e9e; flex: none; margin: 0 0.1em; }
    .ts-gsw-approx { background: none; border: 2px dashed #9e9e9e; box-sizing: border-box; }
    /* Mesh health: rings, weak-hop badges, pane list */
    .ts-hopwarn { display: flex; align-items: center; justify-content: center; border-radius: 50%; font: 700 11px/1 system-ui, sans-serif;
        color: #111; border: 1.5px solid var(--panel); box-sizing: border-box; }
    .ts-hopwarn.ts-warn { background: #ff9800; }
    .ts-hopwarn.ts-bad { background: #e53935; color: #fff; }
    .ts-hopwarn.ts-inline { width: 1.2em; height: 1.2em; flex: none; font-size: 0.8em; }
    .ts-ring { width: 0.8em; height: 0.8em; border-radius: 50%; border: 0.18em solid; flex: none; }
    .ts-health h2 { font-size: 1em; margin: 0.8em 0 0.2em; }
    #ts-healthlist { list-style: none; margin: 0; padding: 0; max-height: 30vh; overflow-y: auto; }
    #ts-healthlist li { display: flex; gap: 0.4em; align-items: baseline; padding: 0.15em 0; }
    #ts-healthlist li[data-y] { cursor: pointer; }
    #ts-healthlist li[data-y]:hover { background: var(--hover); }
    .ts-dot { width: 0.6em; height: 0.6em; border-radius: 50%; flex: none; }
    /* Battery tags */
    .ts-batt { white-space: nowrap; font: 600 10px/1 system-ui, sans-serif; padding: 2px 4px; border-radius: 7px;
        background: var(--panel); color: var(--text); border: 1px solid var(--border); width: auto !important; height: auto !important; }
    .ts-batt-warn { background: #ff9800; color: #111; border-color: #ff9800; }
    .ts-batt-bad { background: #e53935; color: #fff; border-color: #e53935; }
    .ts-batt.ts-inline { font-size: 0.75em; flex: none; }
    .ts-ph circle { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 3 3; }

    /* Import review screen */
    .ts-review { position: fixed; inset: 0; z-index: 2000; background: rgb(0 0 0 / 55%); overflow-y: auto; }
    .ts-review-box { background: var(--panel); color: var(--text); max-width: 960px; margin: 4vh auto; padding: 1em 1.3em;
        border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 6px 24px rgb(0 0 0 / 40%); }
    .ts-review-box h2 { margin: 0 0 0.2em; font-size: 1.3em; }
    .ts-review-box .ts-field input { font: inherit; flex: 1 1 auto; min-width: 0; }
    .ts-review-filter { display: flex; flex-wrap: wrap; gap: 1em; margin: 0.4em 0 0.6em; }
    .ts-review-table { width: 100%; border-collapse: collapse; }
    .ts-review-table th { text-align: left; font-weight: 600; border-bottom: 1px solid var(--border); padding: 0.3em; }
    .ts-review-table td { vertical-align: top; padding: 0.4em 0.3em; border-bottom: 1px solid var(--border); }
    .ts-review-table select { font: inherit; width: 100%; }
    .ts-review-table tr.ts-dup select { outline: 2px solid #c0392b; }
    .ts-conf { display: inline-block; padding: 0.1em 0.5em; border-radius: 1em; font-size: 0.85em; font-weight: 600; color: #111; }
    .ts-conf-certain { background: #2DCC70; }
    .ts-conf-likely { background: #00BCD4; }
    .ts-conf-possible { background: #F1C40F; }
    .ts-conf-none { background: var(--hover); color: var(--muted); }
    .ts-review-warn { color: #c0392b; margin-top: 0.6em; }
    .ts-review-buttons { display: flex; justify-content: flex-end; gap: 0.6em; margin-top: 0.9em; }
    .ts-review-buttons button { font: inherit; padding: 0.45em 1em; cursor: pointer; }
    .ts-review-buttons .ts-primary { font-weight: 600; }
    .ts-review-buttons button:disabled { opacity: 0.5; cursor: default; }
    .leaflet-bar { border-color: var(--border); }
    .leaflet-bar a, .leaflet-bar a:hover { background: var(--panel); color: var(--text); border-bottom-color: var(--border); }
    .leaflet-bar a:hover { background: var(--hover); }
    .leaflet-tooltip-top:before { border-top-color: var(--panel); }
    .leaflet-tooltip-bottom:before { border-bottom-color: var(--panel); }
    .leaflet-tooltip-left:before { border-left-color: var(--panel); }
    .leaflet-tooltip-right:before { border-right-color: var(--panel); }
    .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
    .leaflet-control-layers-separator { border-top-color: var(--border); }

</style>
<script>
    // Follow Z-Wave JS UI's theme. It stores 'dark' | 'light' | 'system' in localStorage
    // 'colorScheme' (older installs: 'dark' = 'true' | 'false') on this same origin.
    // 'system' leaves data-theme unset so the prefers-color-scheme rule applies.
    (function () {
        function zuiTheme() {
            try {
                var s = localStorage.getItem('colorScheme')
                if (s === 'dark' || s === 'light') return s
                if (s === 'system') return null
                var d = localStorage.getItem('dark')
                return d === 'true' ? 'dark' : d === 'false' ? 'light' : null
            } catch (e) { return null }
        }
        function apply() {
            var t = zuiTheme()
            if (t) document.documentElement.setAttribute('data-theme', t)
            else document.documentElement.removeAttribute('data-theme')
        }
        apply()
        // A theme change in a Z-Wave JS UI tab, or in the OS, restyles TopoSite live
        window.addEventListener('storage', function (e) {
            if (e.key === null || e.key === 'colorScheme' || e.key === 'dark') { apply(); window.dispatchEvent(new Event('ts-theme')) }
        })
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
            window.dispatchEvent(new Event('ts-theme'))
        })
    })()
</script>
</head>
<body>
<div id="ts-app">
    <div id="map"></div>
    <div id="ts-resizer" role="separator" aria-orientation="vertical" aria-label="Resize the side pane" tabindex="0"
         title="Drag to resize (or focus and use ← →)"></div>
    <aside id="ts-pane" aria-label="TopoSite controls and legend"></aside>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/socket.io/socket.io.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
